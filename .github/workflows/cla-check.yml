name: CLA check
on:
  pull_request_target:
    types: [opened, edited, synchronize]
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CLA statement
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: echo "$PR_BODY" | grep -Fq "I have read and agree to the Contributor License Agreement in CLA.md."
